name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura del repositorio: CI no publica, no comenta ni etiqueta.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida anterior; en main cada commit se verifica completo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # turbo --affected necesita la historia para comparar con main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Verificar solo lo afectado (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run typecheck test build --affected
      - name: Verificar todo (main)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run typecheck test build
      - name: Construir shared y verificar su empaquetado
        run: pnpm turbo run build --filter=@anticipate/shared && pnpm --filter @anticipate/shared check:package
