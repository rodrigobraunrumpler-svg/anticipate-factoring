glob_matcher: doublestar

pre-commit:
  commands:
    biome:
      glob: '**/*.{ts,tsx,js,mjs,cjs,json,jsonc,css,astro}'
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
